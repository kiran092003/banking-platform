spring.application.name=api-gateway

server.port=8080

# Auth Service
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Account Service
spring.cloud.gateway.server.webmvc.routes[1].id=account-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${ACCOUNT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/account/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Transaction Service
spring.cloud.gateway.server.webmvc.routes[2].id=transaction-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${TRANSACTION_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/transaction/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Notification Service (REST only; the WebSocket is proxied by WebSocketProxyConfig)
spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/notification/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

jwt.secret=${JWT_SECRET}

# Shared secret presented when opening the upstream notification WebSocket.
internal.service.key=${INTERNAL_SERVICE_KEY}

# Upstream WebSocket endpoint on notification-service.
notification.service.ws-url=${NOTIFICATION_WS_URL:ws://localhost:8084/internal/ws/notifications}

# Origins permitted to open a WebSocket. The same-origin policy does not cover
# WebSockets, so this list is the guard against cross-site socket hijacking.
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Upstream /v3/api-docs endpoints aggregated by OpenApiProxyController, and the
# public gateway URL stamped into each spec's `servers` entry.
springdoc.proxy.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
springdoc.proxy.account-url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
springdoc.proxy.transaction-url=${TRANSACTION_SERVICE_URL:http://localhost:8083}
springdoc.proxy.gateway-url=${GATEWAY_PUBLIC_URL:http://localhost:8080}
