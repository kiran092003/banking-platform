# Serves the built React app and stands in for the Vite dev-server proxy
# (see vite.config.ts): /api and /ws stay same-origin for the browser and are
# forwarded to the API Gateway, so the gateway still needs no CORS config.

upstream api_gateway {
    server api-gateway:8080;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed Vite assets are immutable; everything else must revalidate.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST. The trailing slash on proxy_pass strips the /api prefix, matching
    # the dev-server rewrite.
    location /api/ {
        proxy_pass http://api_gateway/;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notification WebSocket. Origin is deliberately passed through untouched:
    # the gateway checks it against websocket.allowed-origins to block
    # cross-site socket hijacking, so rewriting it here would defeat that.
    location /ws/ {
        proxy_pass http://api_gateway/ws/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $http_host;

        # Idle notification sockets must survive between pushes.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # SPA fallback — client-side routes are not files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
